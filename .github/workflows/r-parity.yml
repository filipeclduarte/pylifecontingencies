name: R Parity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  r-parity:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install R lifecontingencies package
        run: Rscript -e "install.packages('lifecontingencies', repos='https://cloud.r-project.org')"

      - name: Install package and parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov rpy2

      - name: Run R parity tests
        run: pytest tests/test_actuarial_vs_r.py tests/test_multilife_vs_r.py -v
