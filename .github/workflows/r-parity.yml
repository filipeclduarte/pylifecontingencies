name: R Parity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  r-parity:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      RPY2_CFFI_MODE: ABI

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Show Python and R environment
        run: |
          python --version
          pip --version
          R --version
          Rscript -e 'sessionInfo()'

      - name: Install system libraries for R packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libharfbuzz-dev libfribidi-dev

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::lifecontingencies
          cache: true

      - name: Install package and parity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-cov
          python -m pip install rpy2

      - name: Show installed Python packages
        run: |
          python -m pip show rpy2 || true
          python -m pip show pytest || true
          python -m pip list

      - name: Check R package availability
        run: |
          Rscript -e "library(lifecontingencies); packageVersion('lifecontingencies')"

      - name: Run R parity tests
        run: pytest tests/test_actuarial_vs_r.py tests/test_multilife_vs_r.py -v
